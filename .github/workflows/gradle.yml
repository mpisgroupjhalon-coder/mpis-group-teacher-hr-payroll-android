name: Build MPIS GROUP APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android project
        shell: bash
        run: |
          echo "Checking project files..."
          find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/.git/*' -print
          test -f settings.gradle || {
            echo "ERROR: Root settings.gradle is missing."
            exit 1
          }
          test -f build.gradle || {
            echo "ERROR: Root build.gradle is missing."
            exit 1
          }
          test -f app/build.gradle || {
            echo "ERROR: app/build.gradle is missing."
            exit 1
          }

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MPIS-GROUP-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
